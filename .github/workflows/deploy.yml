name: deploy-blog

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: 安装 Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'   # 和你本地一致
          extended: true

      - name: 构建
        run: hugo --minify

      - name: 配置 SSH 连接
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: 发布博客
        run: |
          tar -czf /tmp/blog-dist.tar.gz -C public .
          scp -i ~/.ssh/deploy_key /tmp/blog-dist.tar.gz root@${{ secrets.SERVER_HOST }}:/tmp/
          ssh -i ~/.ssh/deploy_key root@${{ secrets.SERVER_HOST }} "rm -rf /opt/blog/* && tar -xzf /tmp/blog-dist.tar.gz -C /opt/blog && rm -f /tmp/blog-dist.tar.gz"