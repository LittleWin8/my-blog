name: deploy-blog

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: 安装 Hugo
        run: |
          curl -fsSL -o /tmp/hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.154.5/hugo_extended_0.154.5_linux-amd64.deb
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: 构建
        run: hugo --minify

      - name: 配置 SSH 连接
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: 发布博客
        run: |
          tar -czf /tmp/blog-dist.tar.gz -C public .
          scp -i ~/.ssh/deploy_key /tmp/blog-dist.tar.gz root@${{ secrets.SERVER_HOST }}:/tmp/
          ssh -i ~/.ssh/deploy_key root@${{ secrets.SERVER_HOST }} "rm -rf /opt/blog/* && tar -xzf /tmp/blog-dist.tar.gz -C /opt/blog && rm -f /tmp/blog-dist.tar.gz"